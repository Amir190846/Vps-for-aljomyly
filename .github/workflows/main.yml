name: VPS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setting up Environment & Tunnel
        run: |
          echo "Initializing VPS environment..."
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip curl wget
          
          # إعداد صلاحيات الـ Root وكلمة المرور الافتراضية المذكورة في الشرح
          echo "root:admin1234" | sudo chpasswd
          sudo sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo systemctl restart ssh
          
          echo "VPS is ready! Check the logs for connection details."
          
          # حلقة إبقاء التشغيل مفعلة للمدة المتاحة
          while true; do
            sleep 30
          done
